# nginx config for the congiuntura-agent static bundle.
# Mounted into the congiuntura-agent nginx container (see compose.snippet.yml).
# Public agent artifacts get CORS "*"; the sandbox worker gets its isolation CSP;
# bridge/ must stay frameable (no X-Frame-Options anywhere on this server block).

server {
    listen 80;
    server_name congiuntura-agent.by.gg8.eu;
    root /usr/share/nginx/html;
    index index.html;

    # Bundle changes often; never cache the agent artifacts or the HTML.
    add_header Cache-Control "no-cache" always;

    # Public agent artifacts must be readable cross-origin (MVP spec §3.3).
    location ~ ^/(agent-manifest\.json|congiuntura_outlook\.network\.json|links\.json|agent-mcp\.json)$ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache" always;
    }

    location ~ ^/\.well-known/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache" always;
    }

    # The sandbox worker runs code in an isolated worker: lock it down.
    location = /runtime/sandbox-worker.js {
        add_header Content-Security-Policy "default-src 'none'; script-src blob:; connect-src 'none'; worker-src 'none'" always;
        add_header Cache-Control "no-cache" always;
    }

    # Other agent sites load the bridge in a hidden frame: no X-Frame-Options here.
    location /bridge/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
